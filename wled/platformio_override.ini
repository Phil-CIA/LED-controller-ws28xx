[env:rev_b_aht20]
extends = env:esp32dev
custom_usermods =
  ${env:esp32dev.custom_usermods}
  AHT10

[env:rev_b_controller]
extends = env:esp32dev
custom_usermods =
  ${env:esp32dev.custom_usermods}
  RevBController
build_flags =
  ${env:esp32dev.build_flags}
  -D SR_DMTYPE=-1
  -D AUDIOPIN=-1
  -D I2S_SDPIN=-1
  -D I2S_WSPIN=-1
  -D I2S_CKPIN=-1
  -D MCLK_PIN=-1
